*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px}
.page{position:relative;width:1080px;height:1350px;overflow:hidden;background:#ffc4e4;font-family:'Inter Tight',sans-serif;color:#ffffff}
.photo{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.shade{position:absolute;inset:0}
.abs{position:absolute}
.big{position:absolute;font-weight:700;letter-spacing:-.04em;line-height:.94;text-shadow:0 2px 24px rgba(0,0,0,.28)}
.hand{position:absolute;font-family:'Caveat',cursive;font-weight:700;line-height:1;color:#ffffff;text-shadow:0 2px 14px rgba(0,0,0,.55),0 0 3px rgba(0,0,0,.35)}
.script{position:absolute;font-family:'Caveat',cursive;font-weight:700;line-height:.95;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55),0 0 3px rgba(0,0,0,.35)}
.pill{position:absolute;background:#fff;color:#1c1c1c;font-weight:500;font-size:34px;letter-spacing:-.01em;padding:10px 24px;border-radius:40px;box-shadow:0 3px 10px rgba(0,0,0,.16);white-space:nowrap}
.bubble{position:absolute;padding:26px 34px;border-radius:44px;font-weight:500;font-size:42px;line-height:1.14;letter-spacing:-.02em;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.sel{position:absolute;font-weight:500;letter-spacing:-.03em;line-height:1.14;color:#fff}
.sel mark{background:#fff0a6;color:#1c1c1c;padding:0 4px;border-radius:3px}
.logo{position:absolute;opacity:.92}

.hd{font-weight:700;letter-spacing:-.04em;line-height:.96;text-shadow:0 2px 24px rgba(0,0,0,.3)}
.tx{font-weight:500;letter-spacing:-.02em;line-height:1.16;text-shadow:0 1px 14px rgba(0,0,0,.35)}
.cta{display:inline-block;background:#fff;color:#1c1c1c;font-weight:600;letter-spacing:-.02em;border-radius:60px;box-shadow:0 3px 14px rgba(0,0,0,.25)}

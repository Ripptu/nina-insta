name: Denken
on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  denken:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/werkzeuge
        with: { claude: "true" }
      - env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node automatik/think.mjs
      - run: |
          git config user.name "nina-insta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A learnings.md plan
          git diff --cached --quiet || (git commit -m "Denk-Lauf: Erkenntnis" && git pull --rebase -q && git push)

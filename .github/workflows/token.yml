name: Token erneuern
on:
  schedule:
    - cron: "30 4 * * 3"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/werkzeuge
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: node automatik/token-erneuern.mjs
      - run: |
          git config user.name "nina-insta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ig-token.enc
          git diff --cached --quiet || (git commit -m "Token erneuert" && git pull --rebase -q && git push)

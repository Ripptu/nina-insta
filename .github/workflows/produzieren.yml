name: Produzieren und prüfen
on:
  schedule:
    - cron: "20 2,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: produzieren
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    outputs:
      noetig: ${{ steps.p.outputs.noetig }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: p
        run: node automatik/puffer.mjs
  produzieren:
    needs: pruefen
    if: needs.pruefen.outputs.noetig == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
      DRIVE_FOLDER: ${{ secrets.DRIVE_FOLDER }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # render/.measure.html liegt im Repository, wird aber bei jedem Rendern mit den Pfaden des Rechners neu geschrieben.
      # Ohne diesen Schritt bricht "git pull --rebase" mit "You have unstaged changes" ab und die Produktion würde nie hochgeladen.
      - name: Laufzeitdatei des Renderers aus der Änderungsverfolgung nehmen
        run: git update-index --skip-worktree render/.measure.html || true
      - uses: ./.github/actions/werkzeuge
        with: { rendern: "true", claude: "true" }
      - name: Vorrat prüfen und ggf. neue Inhalte schreiben
        run: |
          node automatik/vorrat.mjs
      - name: Nachproduzieren und prüfen
        run: node automatik/fill.mjs
      - name: Stand speichern
        if: always()
        run: |
          git config user.name "nina-insta-bot"
          git config user.email "bot@users.noreply.github.com"
          # Die Renderer-Datei zurücksetzen, sonst verweigert "git pull --rebase" wegen ungespeicherter Änderungen
          git update-index --no-skip-worktree render/.measure.html || true
          git checkout -- render/.measure.html || true
          git add -A plan out data docs
          git diff --cached --quiet || git commit -q -m "Produktion: Puffer aufgefüllt"
          # Auch dann hochladen, wenn fill.mjs schon Zwischenstände lokal committet hat (dann ist hier nichts mehr zu committen).
          # Parallel laufen andere Commits: bei abgelehntem Push neu aufsetzen und wiederholen.
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Push nach 5 Versuchen fehlgeschlagen"
          exit 1

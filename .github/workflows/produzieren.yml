name: Produzieren und prüfen
on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: produzieren
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    outputs:
      noetig: ${{ steps.p.outputs.noetig }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: p
        run: node automatik/puffer.mjs
  produzieren:
    needs: pruefen
    if: needs.pruefen.outputs.noetig == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
      DRIVE_FOLDER: ${{ secrets.DRIVE_FOLDER }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/werkzeuge
        with: { rendern: "true", claude: "true" }
      - name: Vorrat prüfen und ggf. neue Inhalte schreiben
        run: |
          node automatik/vorrat.mjs
      - name: Nachproduzieren und prüfen
        run: node automatik/fill.mjs
      - name: Stand speichern
        if: always()
        run: |
          git config user.name "nina-insta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A plan out data docs
          git diff --cached --quiet || (git commit -m "Produktion: Puffer aufgefüllt" && git pull --rebase -q && git push)

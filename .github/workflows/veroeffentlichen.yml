name: Veröffentlichen
on:
  schedule:
    # Feed 20:00 Berlin (18:00 UTC im Sommer, 19:00 UTC im Winter); das Skript prüft die Ortszeit selbst.
    - cron: "5 18,19 * * 1-5"
    # Stories 12:30 Berlin (10:30 bzw. 11:30 UTC)
    - cron: "35 10,11 * * 2,4,0"
  workflow_dispatch:
    inputs:
      trocken: { description: "Trockenlauf (nichts veröffentlichen)", type: boolean, default: true }
      jetzt: { description: "Zeitfenster ignorieren", type: boolean, default: false }
      typ: { description: "karussell, reel oder story (leer = nach Plan)", type: string, default: "" }
permissions:
  contents: write
concurrency:
  group: veroeffentlichen
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/werkzeuge
      - name: Veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || 'Ripptu/nina-insta-media' }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.trocken }}" = "true" ] && ARGS="$ARGS --trocken"
            [ "${{ inputs.jetzt }}" = "true" ] && ARGS="$ARGS --jetzt"
            [ -n "${{ inputs.typ }}" ] && ARGS="$ARGS --typ ${{ inputs.typ }}"
          fi
          node automatik/publish.mjs $ARGS
      - name: Stand speichern
        if: always()
        run: |
          git config user.name "nina-insta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A plan out data
          git diff --cached --quiet || (git commit -m "Veröffentlichung: Queue aktualisiert" && git pull --rebase -q && git push)

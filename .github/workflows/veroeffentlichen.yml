name: Veröffentlichen
on:
  schedule:
    # Feed ab 20:00 Berlin, mehrere Versuche, weil GitHub-Cron oft verspätet startet; das Skript prüft die Ortszeit
    # (Fenster 20:00–22:30) und veröffentlicht höchstens einen Feed-Beitrag pro Tag.
    - cron: "5,35 18,19,20 * * 1-5"
    # Stories ab 12:30 Berlin, ebenfalls mehrfach
    - cron: "35 10,11,12 * * 2,4,0"
    - cron: "5 11,12,13 * * 2,4,0"
  workflow_dispatch:
    inputs:
      trocken: { description: "Trockenlauf (nichts veröffentlichen)", type: boolean, default: true }
      jetzt: { description: "Zeitfenster ignorieren", type: boolean, default: false }
      typ: { description: "karussell, reel oder story (leer = nach Plan)", type: string, default: "" }
permissions:
  contents: write
concurrency:
  group: veroeffentlichen
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: ./.github/actions/werkzeuge
      - name: Veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || 'Ripptu/nina-insta-media' }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.trocken }}" = "true" ] && ARGS="$ARGS --trocken"
            [ "${{ inputs.jetzt }}" = "true" ] && ARGS="$ARGS --jetzt"
            [ -n "${{ inputs.typ }}" ] && ARGS="$ARGS --typ ${{ inputs.typ }}"
          fi
          node automatik/publish.mjs $ARGS
      - name: Stand speichern (mit Zusammenführen bei parallelen Änderungen)
        if: always()
        run: 'node automatik/sichern.mjs "Veröffentlichung: Queue aktualisiert" plan out data'

name: QA-Test (Phase 5)
on: workflow_dispatch
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      QA_TEST_DIR: automatik/qa/pruefung/fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/werkzeuge
        with: { claude: "true" }
      - run: node automatik/qa/pruefung/lauf.mjs

name: Prüfen
on:
  workflow_dispatch:
    inputs:
      max: { description: "Höchstens so viele Beiträge prüfen", type: string, default: "99" }
permissions:
  contents: write
concurrency:
  group: produzieren
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/werkzeuge
        with: { claude: "true" }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
      - name: Prüfen in Portionen (Zwischenstand wird jeweils gespeichert)
        run: |
          git config user.name "nina-insta-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in $(seq 1 10); do
            node automatik/qa-lauf.mjs --max 8 || true
            git add -A plan
            git diff --cached --quiet || (git commit -q -m "Prüfung: Zwischenstand" && git pull --rebase -q && git push -q) || true
          done

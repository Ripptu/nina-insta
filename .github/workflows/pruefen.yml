name: Prüfen
on:
  workflow_dispatch:
    inputs:
      max: { description: "Höchstens so viele Beiträge prüfen", type: string, default: "99" }
permissions:
  contents: write
concurrency:
  group: produzieren
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/werkzeuge
        with: { claude: "true" }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
      - run: node automatik/qa-lauf.mjs --max ${{ inputs.max }}
      - name: Stand speichern
        if: always()
        run: |
          git config user.name "nina-insta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A plan
          git diff --cached --quiet || (git commit -m "Prüfung: Ergebnisse" && git pull --rebase -q && git push)
